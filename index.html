<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Nordic Ski Team Room</title>
<style>
:root{--bg:#EDF0F3;--panel:#fff;--ink:#18212C;--muted:#566273;--line:#C9D1DA;--accent:#1F4E9C;--plate:#F2C230;--bad:#B42318}
@media (prefers-color-scheme:dark){:root{--bg:#11161C;--panel:#1A212A;--ink:#E6EBF0;--muted:#9AA6B4;--line:#2E3946;--accent:#86A9EE;--plate:#E3B52B;--bad:#F28B82;color-scheme:dark}}
[hidden]{display:none!important}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px 16px}
main{width:100%;max-width:380px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:28px 22px;display:flex;flex-direction:column;gap:14px}
.eyebrow{margin:0;font-size:.75rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
h1{margin:0;font-size:1.6rem;line-height:1.15}
form,#r{display:flex;flex-direction:column;gap:10px}
label{font-size:.85rem;color:var(--muted)}
input{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:12px;width:100%}
button{font:inherit;font-weight:600;border:0;border-radius:5px;padding:12px;background:var(--accent);color:var(--panel);cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#e{margin:0;min-height:1.4em;font-size:.9rem;color:var(--bad)}
.combo{background:var(--plate);color:#1A1A12;font:700 2rem/1.2 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.08em;text-align:center;padding:18px 10px;border-radius:5px;word-break:break-word}
#n{margin:0;color:var(--muted)}
</style></head><body><main>
<p class="eyebrow">Locked combination</p><h1>Nordic Ski Team Room</h1>
<form id="f"><label for="p">Password</label><input id="p" type="password" autocomplete="current-password" required><button>Unlock</button><p id="e" role="alert"></p></form>
<section id="r" hidden><div id="c" class="combo"></div><p id="n"></p><button id="h" type="button">Hide again</button></section>
</main>
<script>
var D={s:"pph8Ux4TQH8lGX0+nvuWJw==",i:"S0RizxU3yd7gDSiY",c:"JELn1gzwcuhlQhqxr3meJa6DfHottY/RdFfZBVac9gjvEm0i9YMtwYSZiRJY",n:600000};
function b(x){return Uint8Array.from(atob(x),function(ch){return ch.charCodeAt(0)})}
var g=function(i){return document.getElementById(i)};
g("f").addEventListener("submit",async function(ev){ev.preventDefault();var e=g("e");e.textContent="Checking\u2026";
 try{var k=await crypto.subtle.importKey("raw",new TextEncoder().encode(g("p").value),"PBKDF2",false,["deriveKey"]);
 var key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b(D.s),iterations:D.n,hash:"SHA-256"},k,{name:"AES-GCM",length:256},false,["decrypt"]);
 var o=JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:b(D.i)},key,b(D.c))));
 g("c").textContent=o.combo;g("n").textContent=o.note||"";g("n").hidden=!o.note;g("p").value="";e.textContent="";g("f").hidden=true;g("r").hidden=false;
 }catch(x){e.textContent="Wrong password. Try again.";}});
g("h").addEventListener("click",function(){g("c").textContent="";g("n").textContent="";g("r").hidden=true;g("f").hidden=false;g("p").focus();});
</script>
</body></html>
